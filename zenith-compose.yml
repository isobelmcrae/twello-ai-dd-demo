x-zenith:
  catalog:
    name: Twello
    description: A single-tenant kanban app where a team shares boards of sticky-note tasks.
    authors:
      - isobelmcrae
    tags:
      - kanban
      - productivity
      - project-management
    source: https://github.com/isobelmcrae/twello-ai-dd-demo
    license: NOASSERTION
  expose:
    - service: app
      port: 3000
      web: true
  storage:
    database:
      volume: twello_db
      label: Twello database
      description: Accounts, sessions, boards, columns, tasks and profiles.
  env:
    PGPASSWORD:
      generate: '([A-Za-z0-9_-]{16})([A-Za-z0-9_-]{16})'
      services:
        - app
    POSTGRES_PASSWORD:
      alias: PGPASSWORD
      services:
        - db
    BETTER_AUTH_SECRET:
      generate: '([A-Za-z0-9_-]{24})([A-Za-z0-9_-]{24})'
      services:
        - app
    BETTER_AUTH_URL:
      alias: ZENITH_PUBLIC_URL
      services:
        - app
    DATABASE_URL:
      template: postgresql://twello:{PGPASSWORD}@db:5432/twello
      services:
        - app
    SMTP_HOST: ZENITH_SMTP_HOST
    SMTP_PORT: ZENITH_SMTP_PORT
    SMTP_USERNAME: ZENITH_SMTP_USER
    SMTP_PASSWORD: ZENITH_SMTP_PASS
    SMTP_FROM: ZENITH_SMTP_FROM

services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SMTP_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: twello
      POSTGRES_DB: twello
    volumes:
      - twello_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twello -d twello"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  twello_db:
